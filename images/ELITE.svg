<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Dark Surface Background matching BlockForge Theme -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232938" />
      <stop offset="100%" stop-color="#181c27" />
    </linearGradient>

    <!-- ELITE Fiery Crimson / Red Gradient (Pinnacle Tier Rank Progression) -->
    <linearGradient id="eliteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="50%" stop-color="#d90429" />
      <stop offset="100%" stop-color="#60000e" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a" />
      <stop offset="100%" stop-color="#f2b134" />
    </linearGradient>

    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#323a4f" />
      <stop offset="100%" stop-color="#1b202d" />
    </linearGradient>

    <!-- Filters for Depth and Fiery Crimson Glow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Aggressive Multi-Bladed Outer Crest Wings -->
  <g filter="url(#dropShadow)">
    <!-- Outer Sharp Blades -->
    <polygon points="35,75 5,115 50,230 85,185" fill="url(#eliteGrad)" opacity="0.95" />
    <polygon points="365,75 395,115 350,230 315,185" fill="url(#eliteGrad)" opacity="0.95" />
    
    <polygon points="15,135 0,165 38,245 60,210" fill="url(#eliteGrad)" opacity="0.7" />
    <polygon points="385,135 400,165 362,245 340,210" fill="url(#eliteGrad)" opacity="0.7" />

    <polygon points="50,45 25,75 75,120" fill="url(#goldAccent)" opacity="0.8" />
    <polygon points="350,45 375,75 325,120" fill="url(#goldAccent)" opacity="0.8" />

    <!-- Main Outer Shield Framework -->
    <polygon points="200,15 350,65 330,275 200,380 70,275 50,65" fill="url(#bgGrad)" stroke="#323a4f" stroke-width="6" stroke-linejoin="round"/>
    <!-- Inner Metallic Inset -->
    <polygon points="200,34 332,78 314,262 200,358 86,262 68,78" fill="url(#darkMetal)" stroke="url(#eliteGrad)" stroke-width="4.5" stroke-linejoin="round"/>
  </g>

  <!-- Top BlockForge Crimson Star Peak Accent -->
  <polygon points="200,8 225,30 200,48 175,30" fill="url(#goldAccent)" filter="url(#dropShadow)"/>

  <!-- Elite Pinnacle Crown Emblem -->
  <g transform="translate(0, 5)" filter="url(#dropShadow)">
    <path d="M 145 135 L 165 85 L 185 112 L 200 68 L 215 112 L 235 85 L 255 135 Z" fill="url(#eliteGrad)" stroke="#200005" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="200,68 215,112 185,112" fill="url(#goldAccent)"/>
    <!-- Gem Highlights -->
    <circle cx="200" cy="65" r="5" fill="#ece8da"/>
    <circle cx="165" cy="82" r="4" fill="#f2b134"/>
    <circle cx="235" cy="82" r="4" fill="#f2b134"/>
  </g>

  <!-- Central Typography Ribbon -->
  <g filter="url(#dropShadow)">
    <path d="M 70,205 L 100,185 L 300,185 L 330,205 L 300,260 L 100,260 Z" fill="url(#darkMetal)" stroke="url(#eliteGrad)" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="50,222 70,195 70,250" fill="#d90429" opacity="0.9"/>
    <polygon points="350,222 330,195 330,250" fill="#d90429" opacity="0.9"/>
  </g>

  <!-- ELITE Typography -->
  <text x="200" y="243" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="44" 
        fill="url(#eliteGrad)" 
        text-anchor="middle" 
        letter-spacing="5" 
        stroke="#200005" 
        stroke-width="1.5">ELITE</text>

  <!-- Bottom Rank Stars (5-Star Full Array for Pinnacle Tier) -->
  <g transform="translate(200, 312)">
    <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="url(#goldAccent)"/>
    <polygon points="-22,-9 -19.5,-2.5 -13,0 -19.5,2.5 -22,9 -24.5,2.5 -31,0 -24.5,-2.5" fill="url(#eliteGrad)"/>
    <polygon points="22,-9 24.5,-2.5 31,0 24.5,2.5 22,9 19.5,2.5 13,0 19.5,-2.5" fill="url(#eliteGrad)"/>
    <polygon points="-42,-6 -40,-1 -35,0 -40,1 -42,6 -44,1 -49,0 -44,-1" fill="url(#eliteGrad)"/>
    <polygon points="42,-6 44,-1 49,0 44,1 42,6 40,1 35,0 40,-1" fill="url(#eliteGrad)"/>
  </g>

  <!-- Decorative Tech Glow Lines -->
  <path d="M 200 52 L 200 72 M 100 100 L 120 115 M 300 100 L 280 115" stroke="url(#eliteGrad)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>

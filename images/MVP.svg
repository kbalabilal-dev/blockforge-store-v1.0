<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Dark Surface Background matching BlockForge Theme -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232938" />
      <stop offset="100%" stop-color="#181c27" />
    </linearGradient>

    <!-- MVP Cyan / Diamond Gradient (Higher Tier Rank Progression) -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80f3ff" />
      <stop offset="50%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0066cc" />
    </linearGradient>

    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#323a4f" />
      <stop offset="100%" stop-color="#1b202d" />
    </linearGradient>

    <!-- Filters for Depth and Cyan Glow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Winged Crest Framework -->
  <g filter="url(#dropShadow)">
    <!-- Side Wing Accents -->
    <polygon points="55,120 25,145 60,220 85,190" fill="url(#cyanGrad)" opacity="0.85" />
    <polygon points="345,120 375,145 340,220 315,190" fill="url(#cyanGrad)" opacity="0.85" />
    
    <!-- Main Outer Shield -->
    <polygon points="200,25 335,75 315,260 200,370 85,260 65,75" fill="url(#bgGrad)" stroke="#323a4f" stroke-width="6" stroke-linejoin="round"/>
    <!-- Inner Metallic Inset -->
    <polygon points="200,42 318,87 300,248 200,348 100,248 82,87" fill="url(#darkMetal)" stroke="url(#cyanGrad)" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Top BlockForge Diamond Peak Accent -->
  <polygon points="200,18 218,34 200,50 182,34" fill="url(#cyanGrad)" filter="url(#dropShadow)"/>

  <!-- MVP Diamond Gem Icon (Replacing VIP Crown for Higher Tier) -->
  <g transform="translate(0, 10)" filter="url(#dropShadow)">
    <path d="M 200 90 L 235 115 L 200 160 L 165 115 Z" fill="url(#cyanGrad)" stroke="#0b1e36" stroke-width="2"/>
    <!-- Diamond Facets -->
    <polygon points="200,90 200,160 235,115" fill="#ffffff" opacity="0.25"/>
    <polygon points="182,102 200,118 218,102 200,90" fill="#ffffff" opacity="0.4"/>
    <circle cx="200" cy="118" r="4" fill="#ece8da"/>
  </g>

  <!-- Central Typography Plate -->
  <g filter="url(#dropShadow)">
    <path d="M 85,205 L 110,185 L 290,185 L 315,205 L 290,260 L 110,260 Z" fill="url(#darkMetal)" stroke="url(#cyanGrad)" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="70,222 85,195 85,250" fill="#00c6ff" opacity="0.9"/>
    <polygon points="330,222 315,195 315,250" fill="#00c6ff" opacity="0.9"/>
  </g>

  <!-- MVP Typography -->
  <text x="200" y="243" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="46" 
        fill="url(#cyanGrad)" 
        text-anchor="middle" 
        letter-spacing="5" 
        stroke="#061221" 
        stroke-width="1.5">MVP</text>

  <!-- Bottom Tier Star Accents -->
  <g transform="translate(200, 308)">
    <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="url(#cyanGrad)"/>
    <polygon points="-28,-8 -25.5,-2.5 -19,0 -25.5,2.5 -28,8 -30.5,2.5 -37,0 -30.5,-2.5" fill="url(#cyanGrad)"/>
    <polygon points="28,-8 30.5,-2.5 37,0 30.5,2.5 28,8 25.5,2.5 19,0 25.5,-2.5" fill="url(#cyanGrad)"/>
  </g>

  <!-- Decorative Tech Glow Lines -->
  <path d="M 200 62 L 200 82 M 115 110 L 135 125 M 285 110 L 265 125" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Dark Surface Background matching BlockForge Theme -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232938" />
      <stop offset="100%" stop-color="#181c27" />
    </linearGradient>

    <!-- LEGEND Arcane Magenta / Purple Gradient (High Tier Rank Progression) -->
    <linearGradient id="legendGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff00a0" />
      <stop offset="50%" stop-color="#ae3ec9" />
      <stop offset="100%" stop-color="#6741d9" />
    </linearGradient>

    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#323a4f" />
      <stop offset="100%" stop-color="#1b202d" />
    </linearGradient>

    <!-- Filters for Depth and Arcane Glow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="purpleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Aggressive Double Winged Outer Horns -->
  <g filter="url(#dropShadow)">
    <polygon points="45,95 15,130 55,230 85,190" fill="url(#legendGrad)" opacity="0.9" />
    <polygon points="355,95 385,130 345,230 315,190" fill="url(#legendGrad)" opacity="0.9" />
    <polygon points="20,150 5,180 40,240 60,210" fill="url(#legendGrad)" opacity="0.6" />
    <polygon points="380,150 395,180 360,240 340,210" fill="url(#legendGrad)" opacity="0.6" />

    <!-- Main Outer Shield Framework -->
    <polygon points="200,20 345,70 325,270 200,375 75,270 55,70" fill="url(#bgGrad)" stroke="#323a4f" stroke-width="6" stroke-linejoin="round"/>
    <!-- Inner Metallic Inset -->
    <polygon points="200,38 328,82 310,258 200,352 90,258 72,82" fill="url(#darkMetal)" stroke="url(#legendGrad)" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Top BlockForge Spiked Peak Accent -->
  <polygon points="200,12 222,32 200,48 178,32" fill="url(#legendGrad)" filter="url(#dropShadow)"/>

  <!-- Legendary Spiked Crown Emblem -->
  <g transform="translate(0, 5)" filter="url(#dropShadow)">
    <path d="M 150 140 L 170 95 L 188 120 L 200 80 L 212 120 L 230 95 L 250 140 Z" fill="url(#legendGrad)" stroke="#120524" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="200" cy="78" r="5" fill="#ece8da"/>
    <circle cx="170" cy="92" r="4" fill="#ece8da"/>
    <circle cx="230" cy="92" r="4" fill="#ece8da"/>
  </g>

  <!-- Central Typography Ribbon -->
  <g filter="url(#dropShadow)">
    <path d="M 75,205 L 105,185 L 295,185 L 325,205 L 295,260 L 105,260 Z" fill="url(#darkMetal)" stroke="url(#legendGrad)" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="58,222 75,195 75,250" fill="#ae3ec9" opacity="0.9"/>
    <polygon points="342,222 325,195 325,250" fill="#ae3ec9" opacity="0.9"/>
  </g>

  <!-- LEGEND Typography -->
  <text x="200" y="243" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="40" 
        fill="url(#legendGrad)" 
        text-anchor="middle" 
        letter-spacing="4" 
        stroke="#120524" 
        stroke-width="1.5">LEGEND</text>

  <!-- Bottom Rank Stars (4-Star Array for High Tier) -->
  <g transform="translate(200, 310)">
    <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="url(#legendGrad)"/>
    <polygon points="-24,-10 -21.5,-3 -15,0 -21.5,3 -24,10 -26.5,3 -33,0 -26.5,-3" fill="url(#legendGrad)"/>
    <polygon points="24,-10 26.5,-3 33,0 26.5,3 24,10 21.5,3 15,0 21.5,-3" fill="url(#legendGrad)"/>
    <circle cx="-48" cy="0" r="3" fill="url(#legendGrad)"/>
    <circle cx="48" cy="0" r="3" fill="url(#legendGrad)"/>
  </g>

  <!-- Decorative Tech Lines -->
  <path d="M 200 55 L 200 75 M 105 105 L 125 120 M 295 105 L 275 120" stroke="url(#legendGrad)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Theme Palette Gradients derived from index.css -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232938" />
      <stop offset="100%" stop-color="#181c27" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a" />
      <stop offset="50%" stop-color="#f2b134" />
      <stop offset="100%" stop-color="#b87b0a" />
    </linearGradient>

    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#323a4f" />
      <stop offset="100%" stop-color="#1b202d" />
    </linearGradient>

    <!-- Filters for Depth and Glow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Base Frame -->
  <g filter="url(#dropShadow)">
    <polygon points="200,30 330,90 330,265 200,365 70,265 70,90" fill="url(#bgGrad)" stroke="#323a4f" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="200,45 315,100 315,255 200,345 85,255 85,100" fill="url(#darkMetal)" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- BlockForge Header Accent Block -->
  <rect x="180" y="22" width="40" height="14" fill="url(#goldGrad)" rx="2" filter="url(#dropShadow)"/>

  <!-- Crown Icon -->
  <g transform="translate(0, 8)">
    <path d="M 155 145 L 172 105 L 200 125 L 228 105 L 245 145 Z" fill="#f2b134" opacity="0.25" filter="url(#goldGlow)"/>
    <path d="M 155 145 L 172 105 L 200 125 L 228 105 L 245 145 Z" fill="url(#goldGrad)" stroke="#1b1405" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="172" cy="101" r="5" fill="#ece8da"/>
    <circle cx="200" cy="118" r="6" fill="#ece8da"/>
    <circle cx="228" cy="101" r="5" fill="#ece8da"/>
  </g>

  <!-- Center Text Plate / Ribbon -->
  <g filter="url(#dropShadow)">
    <path d="M 95 210 L 115 190 L 285 190 L 305 210 L 285 260 L 115 260 Z" fill="url(#darkMetal)" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="80,225 95,200 95,250" fill="#f2b134" opacity="0.8"/>
    <polygon points="320,225 305,200 305,250" fill="#f2b134" opacity="0.8"/>
  </g>

  <!-- VIP Typography -->
  <text x="200" y="243" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="48" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        letter-spacing="6" 
        stroke="#1b1405" 
        stroke-width="1.5">VIP</text>

  <!-- Bottom Forge Star Accent -->
  <g transform="translate(200, 305)">
    <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="url(#goldGrad)"/>
    <circle cx="-28" cy="0" r="3" fill="url(#goldGrad)"/>
    <circle cx="28" cy="0" r="3" fill="url(#goldGrad)"/>
  </g>

  <!-- Minimal Decorative Tech Lines -->
  <path d="M 200 65 L 200 90 M 125 120 L 142 133 M 275 120 L 258 133" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
</svg>
